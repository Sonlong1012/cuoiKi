<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relay Control</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f8;
    }
    table {
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 12px;
    }
    td {
      padding: 10px 14px;
      text-align: center;
    }
    .relay-control {
      font-size: 28px;
      font-weight: 700;
    }
    .label {
      font-weight: 600;
      text-align: left;
      min-width: 120px;
    }
    .value {
      min-width: 120px;
      font-weight: 600;
    }
    .led {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      margin: 0 auto;
      background: #d0d0d0;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.2);
    }
    .led-on-red {
      background: #ff2b2b;
      box-shadow: 0 0 12px rgba(255, 43, 43, 0.8);
    }
    .led-on-green {
      background: #13c64b;
      box-shadow: 0 0 12px rgba(19, 198, 75, 0.8);
    }
    .toggle-button {
      display: inline-block;
      width: 60px;
      height: 34px;
      position: relative;
      cursor: pointer;
      border-radius: 17px;
      background-color: #ccc;
      transition: background-color 0.25s;
    }
    .toggle-button:before {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #fff;
      top: 3px;
      left: 3px;
      transition: transform 0.25s;
    }
    input[type="checkbox"] {
      display: none;
    }
    input[type="checkbox"]:checked + .toggle-button {
      background-color: #66bb6a;
    }
    input[type="checkbox"]:checked + .toggle-button:before {
      transform: translateX(26px);
    }
    .hint {
      font-size: 12px;
      color: #666;
      text-align: left;
    }
    .disabled {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body onload="pageLoad()">
  <table cellspacing="8">
    <tr>
      <td colspan="3"><strong class="relay-control">Relay Control</strong></td>
    </tr>
    <tr>
      <td class="label">Chế độ:</td>
      <td class="value"><span id="lblMode">MANUAL</span></td>
      <td>
        <label for="modeSwitch">
          <input type="checkbox" id="modeSwitch" onchange="toggleAutoMode()">
          <span class="toggle-button"></span>
        </label>
      </td>
    </tr>
    <tr>
      <td colspan="3" class="hint">Bật công tắc = AUTO, tắt công tắc = MANUAL</td>
    </tr>
    <tr>
      <td class="label">Relay:</td>
      <td class="value"><span id="lblValue">Tắt</span></td>
      <td>
        <label for="relaySwitch" id="relaySwitchWrap">
          <input type="checkbox" id="relaySwitch" onchange="toggleRelay()">
          <span class="toggle-button"></span>
        </label>
      </td>
    </tr>
    <tr>
      <td class="label">Red LED:</td>
      <td><div id="redLed" class="led"></div></td>
      <td class="hint">Đỏ = bật</td>
    </tr>
    <tr>
      <td class="label">Green LED:</td>
      <td><div id="greenLed" class="led"></div></td>
      <td class="hint">Xanh = tắt</td>
    </tr>
    <tr>
      <td class="label">Soil:</td>
      <td class="value"><span id="lblSoil">--</span></td>
      <td class="hint">Giá trị cảm biến</td>
    </tr>
  </table>

  <script>
    const DB_URL = "https://long-bc130-default-rtdb.asia-southeast1.firebasedatabase.app";
    const DB_SECRET = "Gj0w1L8JKWJQmHzltn9lzsxxOVJZdbjLhxFIUi7c";

    function dbUrl(path) {
      return `${DB_URL}/${path}.json?auth=${DB_SECRET}`;
    }

    async function getDb(path) {
      const res = await fetch(dbUrl(path));
      if (!res.ok) throw new Error(`GET ${path} failed`);
      return res.json();
    }

    async function setDb(path, value) {
      const res = await fetch(dbUrl(path), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(value)
      });
      if (!res.ok) throw new Error(`PUT ${path} failed`);
    }

    function updateUi(state) {
      const autoMode = Number(state.AutoMode) === 1 ? 1 : 0;
      const relayStatus = Number(state.RelayStatus) === 1 ? 1 : 0;
      const soilMoisture = Number(state.SoilMoisture);

      const modeSwitch = document.getElementById("modeSwitch");
      const relaySwitch = document.getElementById("relaySwitch");
      const relaySwitchWrap = document.getElementById("relaySwitchWrap");
      const lblMode = document.getElementById("lblMode");
      const lblValue = document.getElementById("lblValue");
      const lblSoil = document.getElementById("lblSoil");
      const redLed = document.getElementById("redLed");
      const greenLed = document.getElementById("greenLed");

      modeSwitch.checked = autoMode === 1;
      relaySwitch.checked = relayStatus === 1;
      lblMode.textContent = autoMode === 1 ? "AUTO" : "MANUAL";
      lblValue.textContent = relayStatus === 1 ? "Bật" : "Tắt";
      lblSoil.textContent = Number.isFinite(soilMoisture) ? soilMoisture : "--";

      relaySwitch.disabled = autoMode === 1;
      relaySwitchWrap.classList.toggle("disabled", autoMode === 1);

      redLed.classList.toggle("led-on-red", relayStatus === 1);
      greenLed.classList.toggle("led-on-green", relayStatus === 0);
    }

    async function refreshState() {
      try {
        const [autoMode, relayStatus, soilMoisture] = await Promise.all([
          getDb("AutoMode"),
          getDb("RelayStatus"),
          getDb("SoilMoisture")
        ]);
        updateUi({ AutoMode: autoMode, RelayStatus: relayStatus, SoilMoisture: soilMoisture });
      } catch (err) {
        console.error(err);
      }
    }

    async function toggleAutoMode() {
      const modeSwitch = document.getElementById("modeSwitch");
      const modeValue = modeSwitch.checked ? 1 : 0;
      try {
        await setDb("AutoMode", modeValue);
        await refreshState();
      } catch (err) {
        console.error(err);
      }
    }

    async function toggleRelay() {
      const relaySwitch = document.getElementById("relaySwitch");
      const relayValue = relaySwitch.checked ? 1 : 0;
      try {
        await setDb("RelayStatus", relayValue);
        await refreshState();
      } catch (err) {
        console.error(err);
      }
    }

    async function pageLoad() {
      await refreshState();
      setInterval(refreshState, 1200);
    }
  </script>
</body>
</html>
